name: CI

# workflow_call lets publish.yml run this same lint + test matrix against a
# tagged commit before releasing, so the two files never drift apart.
#
# Tag pushes are ignored here: `on: push` would otherwise start a second CI
# alongside publish.yml's workflow_call. Those two (and a same-SHA branch
# push) share setup-uv cache keys and race with "Unable to reserve cache".
on:
  push:
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

# One CI run per commit. A main push and a tag's workflow_call of this file
# would otherwise overlap and fight over the uv cache.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: lint-py3.14
      - run: uv sync --all-extras
      - name: Check formatting
        run: uv run ruff format --check src tests examples
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Type check
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: test-py${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest -q --cov-fail-under=100
      - name: Examples
        run: |
          uv run python examples/basic_usage.py
          uv run python examples/prometheus_pool.py --once | tee /tmp/rotapool-metrics.txt
          grep -q rotapool_runs_total /tmp/rotapool-metrics.txt
