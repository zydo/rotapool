name: CI

# workflow_call lets publish.yml run this same lint + test matrix against a
# tagged commit before releasing, so the two files never drift apart.
#
# `branches: ["**"]` (and no tag filter) means branch pushes run CI while tag
# pushes do not: publish.yml already calls this workflow for v* releases, and
# `on: push` firing on the tag too would race its workflow_call over the
# shared setup-uv cache ("Unable to reserve cache"). Note: a `push` block with
# only `tags`/`tags-ignore` and no `branches` filter never runs on branch
# pushes at all -- that gap silenced CI between v0.4.0 and this change.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

# One CI run per commit at a time. Pushing a release commit and its tag both
# start this workflow (the branch push, and publish.yml's workflow_call).
# Cancelling the one already running leaves a red check on the release.
# Queue instead, so they never overlap on the setup-uv cache and both finish.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: lint-py3.14
      - run: uv sync --all-extras
      - name: Check formatting
        run: uv run ruff format --check src tests examples
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Type check
        run: uv run pyright

  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: test-py${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest -q --cov-fail-under=100
      - name: Examples
        run: |
          uv run python examples/basic_usage.py
          uv run python examples/prometheus_pool.py --once | tee /tmp/rotapool-metrics.txt
          grep -q rotapool_runs_total /tmp/rotapool-metrics.txt
